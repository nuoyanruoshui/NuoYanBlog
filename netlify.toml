[build]
  # 构建镜像里已经预装 pnpm（且 Node 22），再 `npm install -g pnpm` 会因文件已存在直接失败
  command = "pnpm build"
  publish = "dist"

# 带宽优化：带 hash 的构建产物可以永久缓存，图片缓存一周
# （Netlify 默认给静态资源 max-age=0，等于每次访问都重新校验，白白多跑流量）
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
