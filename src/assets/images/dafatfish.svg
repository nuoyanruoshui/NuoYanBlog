<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#7FA9FF"/>
      <stop offset="55%" stop-color="#4D6BFE"/>
      <stop offset="100%" stop-color="#3A4FD6"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#D6E4FF" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="28%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 水花 -->
  <g fill="#8FB4FF" opacity="0.85">
    <circle cx="96" cy="26" r="4.5"/>
    <circle cx="112" cy="38" r="3"/>
    <circle cx="82" cy="40" r="2.6"/>
  </g>

  <!-- 尾巴 -->
  <path d="M156 118 C168 104 182 98 192 100 C184 110 182 120 186 130 C176 128 164 126 156 132 Z"
        fill="url(#body)" opacity="0.95"/>

  <!-- 身体 -->
  <ellipse cx="100" cy="118" rx="74" ry="60" fill="url(#body)"/>
  <path d="M26 118 C26 84 58 60 100 60 C142 60 172 84 174 118 C174 150 142 176 100 176 C58 176 26 150 26 118 Z"
        fill="url(#glow)"/>

  <!-- 肚皮 -->
  <ellipse cx="100" cy="140" rx="54" ry="34" fill="url(#belly)"/>

  <!-- 小鳍 -->
  <ellipse cx="52" cy="146" rx="16" ry="9" fill="#4560E8" transform="rotate(-18 52 146)"/>
  <ellipse cx="148" cy="146" rx="16" ry="9" fill="#4560E8" transform="rotate(18 148 146)"/>

  <!-- 眼睛 -->
  <g>
    <ellipse cx="78" cy="106" rx="11" ry="12.5" fill="#ffffff"/>
    <ellipse cx="122" cy="106" rx="11" ry="12.5" fill="#ffffff"/>
    <circle cx="80" cy="108" r="6.6" fill="#1B2340"/>
    <circle cx="120" cy="108" r="6.6" fill="#1B2340"/>
    <circle cx="82.6" cy="104.8" r="2.4" fill="#ffffff"/>
    <circle cx="122.6" cy="104.8" r="2.4" fill="#ffffff"/>
  </g>

  <!-- 腮红 -->
  <ellipse cx="62" cy="128" rx="10" ry="6" fill="#FF9EC4" opacity="0.55"/>
  <ellipse cx="138" cy="128" rx="10" ry="6" fill="#FF9EC4" opacity="0.55"/>

  <!-- 笑 -->
  <path d="M92 128 Q100 137 108 128" stroke="#1B2340" stroke-width="3.2" fill="none" stroke-linecap="round"/>

  <!-- 蝴蝶结 -->
  <g transform="translate(100 58)">
    <path d="M-2 0 C-16 -10 -26 -4 -24 6 C-22 14 -10 14 -2 6 Z" fill="#FF7FB0"/>
    <path d="M2 0 C16 -10 26 -4 24 6 C22 14 10 14 2 6 Z" fill="#FF7FB0"/>
    <circle cx="0" cy="4" r="4.2" fill="#FF4F93"/>
  </g>
</svg>
